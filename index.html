<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a3d91">
<title>Armazém Mateus · CD-84</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
:root{--az:#0a3d91;--am:#ffc20e;--bg:#eef2f8;--ink:#0f1b2d;--mut:#5b6b82;--ln:#d5deea;--ok:#16794a;--bad:#c2301f;--warn:#a86400}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 Manrope,system-ui,sans-serif;padding-bottom:84px}
.hd{background:var(--az);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:4px solid var(--am);position:sticky;top:0;z-index:5}
.hd strong{display:block;font:800 20px Manrope}.hd small{opacity:.8;font-size:13px}
main,.w{max-width:720px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:12px}
.card.okc{border-color:var(--ok);background:#eaf6ef}.card.badc{border-color:var(--bad);background:#fcebe8}
h2{margin:0 0 6px;font:800 21px Manrope}h3{margin:18px 0 8px;font:800 17px Manrope}
p{margin:6px 0}small,.mut{color:var(--mut);font-size:13px}.c{text-align:center}
label.l{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--ln);border-radius:10px;font:inherit;background:#fff}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #8db3f0;outline-offset:1px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--az);color:#fff;font:800 16px Manrope;cursor:pointer;margin-top:12px}
.btn:disabled{opacity:.45;cursor:default}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ln)}.btn.sm{width:auto;padding:8px 12px;font-size:14px;margin:0}
.lk{background:none;border:0;color:#cfe0ff;font:700 13px Manrope;text-decoration:underline;cursor:pointer}
.pl{display:inline-flex;flex-direction:column;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:#fff;color:var(--ink);flex:none}
.pl i{background:var(--az);color:#fff;font:700 8px Manrope;text-align:center;padding:1px 10px;font-style:normal}
.pl b{font:700 22px/1.1 'Barlow Condensed';letter-spacing:2px;padding:1px 8px;text-align:center}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.row>div{flex:1;min-width:0}.row b,.row small{display:block}
.tg{font:800 12px Manrope;padding:3px 10px;border-radius:99px;white-space:nowrap}
.tg.a{background:#fff1cc;color:var(--warn)}.tg.b{background:#dce8ff;color:var(--az)}.tg.g{background:#dcf2e5;color:var(--ok)}.tg.r{background:#fbe0dc;color:var(--bad)}
.pos{text-align:center;padding:6px 0}.pos b{display:block;font:700 112px/1 'Barlow Condensed';color:var(--az)}.pos span{font-weight:800}
.pos.go b{font-size:84px;color:var(--ok)}
.st{list-style:none;display:flex;padding:0;margin:0 0 14px}
.st li{flex:1;text-align:center;font-size:12px;color:var(--mut);padding-top:18px;position:relative}
.st li:before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:var(--ln)}
.st li.d:before{background:var(--ok)}.st li.n:before{background:var(--am);box-shadow:0 0 0 5px #ffc20e55}.st li.n{color:var(--ink);font-weight:800}
.spin{width:44px;height:44px;border:5px solid var(--ln);border-top-color:var(--az);border-radius:50%;animation:r 1s linear infinite;margin:6px auto}
@keyframes r{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.cam{display:flex;align-items:center;justify-content:center;min-height:150px;border:2px dashed var(--az);border-radius:12px;color:var(--az);font-weight:800;cursor:pointer;overflow:hidden;margin:10px 0 0;text-align:center;padding:8px}
.cam img{width:100%;display:block}.cam input{display:none}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.thumbs img,.gal img,.ft{width:100%;border-radius:10px;border:1px solid var(--ln);cursor:zoom-in;display:block}
.thumbs img,.gal img{aspect-ratio:1;object-fit:cover}.ft{margin-top:10px;min-height:60px;background:#e4eaf3}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:10px 0}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.bar button{flex:1;padding:14px;border:0;border-top:4px solid transparent;background:none;font:800 15px Manrope;color:var(--mut);cursor:pointer}
.bar button.on{color:var(--az);border-top-color:var(--am)}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media(min-width:600px){.kp{grid-template-columns:repeat(4,1fr)}}
.kp div{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
.kp b{display:block;font:700 36px/1 'Barlow Condensed'}.kp span{font-size:13px;color:var(--mut)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex:none;padding:10px 14px;border:1.5px solid var(--ln);background:#fff;border-radius:99px;font:800 14px Manrope;cursor:pointer}
.tabs button.on{background:var(--az);color:#fff;border-color:var(--az)}
.tabs i{font-style:normal;background:var(--am);color:var(--ink);border-radius:99px;padding:0 7px;margin-left:6px;font-size:12px}
.acts{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;margin-top:10px}.acts>*{margin:0!important}
.tools{display:flex;gap:8px;margin-bottom:12px}.tools .btn{margin:0}
.n{font:700 34px/1 'Barlow Condensed';color:var(--az);min-width:40px;text-align:center}
details.v{background:#fff;border:1px solid var(--ln);border-radius:14px;margin-bottom:10px;overflow:hidden}
details.v>summary{list-style:none;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.v>summary::-webkit-details-marker{display:none}
.ass{border-top:1px solid var(--ln);padding:14px}
.resp{background:#eef4ff;border-radius:10px;padding:8px 10px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--ln)}th{color:var(--mut);font-size:12px}
.hide{display:none!important}.vz{color:var(--mut);text-align:center;padding:26px 0}
#ts{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;z-index:20;display:none;max-width:90vw;text-align:center}
#zm{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;overflow:auto;padding:12px;gap:10px;z-index:30}
#zm img{margin:auto;max-width:96vw;max-height:92vh}
.gal.fw{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}.gal.fw img{aspect-ratio:auto;object-fit:contain;background:#e4eaf3}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.seg button{padding:12px;border:1.5px solid var(--ln);background:#fff;border-radius:10px;font:800 15px Manrope;cursor:pointer}
.seg button.on{background:var(--az);color:#fff;border-color:var(--az)}
.alerta{position:sticky;top:70px;z-index:4;background:var(--am);color:var(--ink);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-weight:800}.alerta .btn{background:var(--ink)}
.card.me{border-color:var(--az);background:#eef4ff}
.hr{display:flex;align-items:center;gap:12px;justify-content:flex-end}.hr .lk{padding:8px 4px;font-size:14px}
footer{text-align:center}footer a{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<header class="hd">
  <div><strong>Armazém Mateus</strong><small>CD-84 · Expedição Marabá-PA</small></div>
  <div class="hr"><div id="who"></div><button class="lk" id="mode" onclick="modo()">Administrador</button></div>
</header>

<!-- ===== MOTORISTA ===== -->
<div id="drv">
<main>
  <div id="reg" class="card hide">
    <h2>Identificação do motorista</h2><p class="mut">Preencha uma vez. Os dados ficam salvos neste aparelho.</p>
    <label class="l" for="r-placa">Placa</label><input id="r-placa" maxlength="8" placeholder="ABC1D23" autocomplete="off">
    <label class="l" for="r-nome">Nome</label><input id="r-nome" placeholder="Nome completo">
    <label class="l" for="r-tipo">Veículo</label>
    <select id="r-tipo"><option>3/4</option><option>Toco</option><option>Truck</option><option>Truck alongado</option></select>
    <button class="btn" onclick="salvarId()">Entrar</button>
  </div>
  <div id="home" class="hide">
    <section id="sf"></section>
    <section id="so" class="hide"></section>
    <section id="sa" class="hide">
      <div class="card">
        <h2>Registrar assistência</h2><p class="mut">Informe a avaria encontrada e anexe pedidos para comprovar.</p>
        <label class="l" for="a-cli">Cliente / pedido</label><input id="a-cli" placeholder="Nome do cliente ou nº do pedido">
        <label class="l" for="a-end">Endereço da entrega</label><input id="a-end" placeholder="Rua, número, bairro">
        <label class="l" for="a-tipo">Tipo</label>
        <select id="a-tipo"><option>Avaria no produto</option><option>Avaria no carregamento</option><option>Produto faltando</option><option>Produto errado</option><option>Cliente recusou</option><option>Outro</option></select>
        <label class="l" for="a-desc">Descrição da avaria</label><textarea id="a-desc" rows="3" placeholder="Descreva o que aconteceu"></textarea>
        <label class="cam" style="min-height:70px"><input type="file" accept="image/*" capture="environment" multiple onchange="pegarA(this)">Adicionar pedidos</label>
        <div class="thumbs" id="pf"></div>
        <button class="btn" onclick="enviarAss(this)">Enviar assistência</button>
      </div>
      <h3>Minhas assistências</h3><div id="minhas"></div>
    </section>
  </div>
</main>
<nav class="bar hide" id="bar">
  <button id="b-f" class="on" onclick="tabD('f')">Minha vez</button>
  <button id="b-o" onclick="tabD('o')">Ordem de chegada</button>
  <button id="b-a" onclick="tabD('a')">Assistência</button>
</nav>
</div>

<!-- ===== ADMINISTRADOR ===== -->
<div id="adm" class="hide"><div class="w">
  <div id="lg" class="card"><h2>Acesso do administrador</h2>
    <label class="l" for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" onkeydown="if(event.key==='Enter')entrar()">
    <button class="btn" onclick="entrar()">Entrar</button></div>
  <div id="pn" class="hide">
    <div id="al" class="alerta hide"></div>
    <div class="kp" id="kp"></div>
    <div class="tabs" id="tb"></div>
    <div id="tc"></div>
  </div>
</div></div>

<footer class="w"><a id="lk" href="#" onclick="modo();return false">Acesso administrador</a></footer>
<div id="ts"></div>
<div id="zm" onclick="this.style.display='none'"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== CONFIGURAÇÃO ===== */
const CFG={PIN:"1234",DOCAS:8,DIAS:7,DIAS_MOT:2,DIAS_ASS:90,FOTO_DIAS:30}; // FOTO_DIAS: pedidos mais antigos são apagadas; o registro em texto fica
const firebaseConfig={
  apiKey: "AIzaSyDQdTt00ZvImDdkpQrSHqcuWlojpARJHLM",
  authDomain: "cd84-mateus.firebaseapp.com",
  projectId: "cd84-mateus",
  storageBucket: "cd84-mateus.firebasestorage.app",
  messagingSenderId: "179465454930",
  appId: "1:179465454930:web:47252b8d58d936e4e4e68b"
};
const FILA="fila_cd84",ASS="assistencias_cd84",FOT="fotos_cd84";
const MOT=["Baú não está vazio","Pedido ilegível","Placa não confere","Pedido fora do pátio","Outro"];
const TRAT=["Reposição do produto","Troca do produto","Reparo no local","Retorno ao CD","Crédito ao cliente","Sem procedência"];
const LB={analise:"Em análise",aprovado:"Na fila",carregando:"Carregando",finalizado:"Finalizado",reprovado:"Reprovado",cancelado:"Cancelado"};

/* ===== DADOS (Firestore; sem config usa localStorage para teste) ===== */
const online=firebaseConfig.apiKey!=="COLE_AQUI";
let db;if(online){firebase.initializeApp(firebaseConfig);db=firebase.firestore()}
const LS={g:k=>JSON.parse(localStorage.getItem(k)||"[]"),s:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const S={
 async add(c,o,id=uid()){if(online)await db.collection(c).doc(id).set(o);else LS.s(c,[...LS.g(c),{id,...o}]);return id},
 async upd(c,id,o){if(online)return db.collection(c).doc(id).update(o);LS.s(c,LS.g(c).map(x=>x.id===id?{...x,...o}:x))},
 async put(id,f){if(online)return db.collection(FOT).doc(id).set({f});localStorage.setItem("f"+id,JSON.stringify(f))},
 async get(id){if(online){const d=await db.collection(FOT).doc(id).get();return d.exists?d.data().f:null}const v=localStorage.getItem("f"+id);return v?JSON.parse(v):null},
 on(c,cb,placa,dias){
  const since=Date.now()-(dias||CFG.DIAS)*864e5;
  if(online){let q=db.collection(c);q=placa?q.where("placa","==",placa):q.where("ts",">=",since);return q.onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))))}
  let p="";const run=()=>{const v=LS.g(c).filter(x=>x.ts>=since&&(!placa||x.placa===placa)),j=JSON.stringify(v);if(j!==p){p=j;cb(v)}};
  run();return setInterval(run,1000)}
};

/* ===== UTIL ===== */
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nP=v=>v.toUpperCase().replace(/[^A-Z0-9]/g,"");
const placaOk=p=>/^[A-Z]{3}\d[A-Z0-9]\d{2}$/.test(p);
const fmt=t=>new Date(t).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
const hm=t=>new Date(t).toLocaleTimeString("pt-BR",{timeStyle:"short"});
const dur=ms=>{const m=Math.max(0,Math.floor(ms/6e4));return m<60?m+" min":Math.floor(m/60)+"h"+String(m%60).padStart(2,"0")};
const chip=p=>`<span class="pl"><i>BRASIL</i><b>${esc(p)}</b></span>`;
const vz=t=>`<div class="vz">${t}</div>`;
const tg=s=>{const c={"Em análise":"a","Aberta":"a","Na fila":"b","Em tratativa":"b","Carregando":"b","Concluída":"g","Finalizado":"g","Negada":"r","Reprovado":"r","Cancelado":"r"}[s]||"a";return`<span class="tg ${c}">${esc(s)}</span>`};
function toast(t,e){const x=$("ts");x.textContent=t;x.style.background=e?"var(--bad)":"var(--ink)";x.style.display="block";clearTimeout(x.t);x.t=setTimeout(()=>x.style.display="none",2600)}
const salvarFotos=a=>Promise.all(a.map((f,k)=>{const i=uid()+k;return S.put(i,f).then(()=>i)}));
function ampliar(s){$("zm").innerHTML=[].concat(s).map(x=>`<img src="${x}" alt="Pedido ampliado">`).join("");$("zm").style.display="flex"}
function foto(file,placa){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const i=new Image();i.onerror=no;i.onload=()=>{
 const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;
 const x=c.getContext("2d");x.drawImage(i,0,0,c.width,c.height);const h=Math.max(22,c.height*.045);
 x.fillStyle="rgba(10,61,145,.88)";x.fillRect(0,c.height-h,c.width,h);x.fillStyle="#fff";x.font=`700 ${h*.58}px sans-serif`;x.textBaseline="middle";
 x.fillText(`CD-84 | ${placa} | ${new Date().toLocaleString("pt-BR")}`,8,c.height-h/2);ok(c.toDataURL("image/jpeg",.6))};i.src=r.result};r.readAsDataURL(file)})}

/* ===== MOTORISTA ===== */
let me=JSON.parse(localStorage.getItem("me")||"null"),FL=[],AM=[],pend=null,pfs=[],sig="",vez="vazio",pendR=[],rmot="",dInit=0;
function initDrv(){if(dInit)return;dInit=1;if(!me){$("reg").classList.remove("hide");return}
 $("home").classList.remove("hide");$("bar").classList.remove("hide");
 $("who").innerHTML=`${chip(me.placa)} <button class="lk" onclick="trocar()">Trocar</button>`;
 S.on(FILA,d=>{FL=d;rFila();rOrdem()},0,CFG.DIAS_MOT);S.on(ASS,d=>{AM=d;rMin()},me.placa);setInterval(()=>{rFila();rOrdem()},30000)}
function salvarId(){const placa=nP($("r-placa").value),nome=$("r-nome").value.trim();
 if(!placaOk(placa))return toast("Placa inválida",1);if(!nome)return toast("Informe o nome",1);
 localStorage.setItem("me",JSON.stringify({placa,nome,tipo:$("r-tipo").value}));location.reload()}
function trocar(){localStorage.removeItem("me");location.reload()}
function tabD(t){["f","o","a"].forEach(k=>{$({f:"sf",o:"so",a:"sa"}[k]).classList.toggle("hide",t!==k);$("b-"+k).classList.toggle("on",t===k)})}
const steps=n=>`<ol class="st">${["Em análise","Na fila","Na doca","Concluído"].map((t,i)=>`<li class="${i<n?"d":i===n?"n":""}">${t}</li>`).join("")}</ol>`;
function rFila(){
 const mine=FL.filter(x=>x.placa===me.placa).sort((a,b)=>b.ts-a.ts)[0],st=mine&&mine.status;
 const q=FL.filter(x=>x.status==="aprovado").sort((a,b)=>a.ts-b.ts),ativo=["analise","aprovado","carregando"].includes(st);
 const s2=(mine?mine.id+st:"-")+(pend?1:0)+vez+pendR.length;if(!ativo&&s2===sig)return;sig=s2;
 let h="";
 if(ativo){
  h+=`<div class="card">${steps(["analise","aprovado","carregando"].indexOf(st))}`;
  if(st==="analise")h+=`<div class="c"><div class="spin"></div><h2>Pedido em análise</h2><p class="mut">O administrador está conferindo o baú. Enviada às ${hm(mine.ts)}.</p></div>`;
  if(st==="aprovado"){const p=q.findIndex(x=>x.id===mine.id)+1;
   h+=`<div class="pos"><b>${p}º</b><span>${p===1?"Você é o próximo a carregar":`${p-1} veículo(s) à sua frente`}</span></div><p class="c mut">${q.length} veículo(s) na fila · aprovado às ${hm(mine.tsAprov||mine.ts)}. Fique atento ao chamado.</p>`}
  if(st==="carregando")h+=`<div class="pos go"><b>Doca ${esc(mine.doca)}</b><span>Dirija-se à doca para carregar</span></div>`;
  if(st!=="carregando")h+=`<button class="btn ghost" onclick="sair('${mine.id}')">Sair da fila</button>`;
  h+=`</div>`;
 }else{
  if(st==="finalizado")h+=`<div class="card okc"><h2>Carregamento concluído</h2><p>Boa viagem, ${esc(me.nome)}.</p></div>`;
  if(st==="reprovado")h+=`<div class="card badc"><h2>Pedido reprovado</h2><p>${esc(mine.motivo||"Envie um novo pedido.")}</p></div>`;
  h+=`<div class="card"><h2>Marcar minha vez</h2>
   <div class="seg"><button class="${vez==="vazio"?"on":""}" onclick="setVez('vazio')">Baú vazio</button><button class="${vez==="retorno"?"on":""}" onclick="setVez('retorno')">Com retorno</button></div>
   ${vez==="vazio"?`<p class="mut">Fotografe o baú vazio e aberto, com a placa visível. O pedido sai com data, hora e placa.</p>
   <label class="cam"><input type="file" accept="image/*" capture="environment" onchange="pegar(this)">${pend?`<img src="${pend}" alt="Prévia">`:"Abrir câmera"}</label>`
   :`<p class="mut">Fotografe todas as folhas do romaneio e descreva o motivo do retorno.</p>
   <label class="cam" style="min-height:70px"><input type="file" accept="image/*" capture="environment" multiple onchange="pegarR(this)">Fotografar romaneio</label>
   <div class="thumbs">${pendR.map((s,i)=>`<img src="${s}" alt="Romaneio ${i+1}" title="Toque para remover" onclick="pendR.splice(${i},1);rFila()">`).join("")}</div>
   <label class="l" for="r-mot">Motivo do retorno</label><textarea id="r-mot" rows="3" placeholder="Descreva por que a carga está retornando" oninput="rmot=this.value">${esc(rmot)}</textarea>`}
   <button class="btn" onclick="enviarVez(this)">Enviar para análise</button></div>`;
 }
 $("sf").innerHTML=h}
function setVez(v){vez=v;rFila()}
async function pegar(i){const f=i.files[0];if(!f)return;try{pend=await foto(f,me.placa);rFila()}catch(e){toast("Não foi possível ler o pedido",1)}}
async function pegarR(i){try{for(const f of i.files)pendR.push(await foto(f,me.placa));}catch(e){toast("Não foi possível ler o pedido",1)}rFila()}
async function enviarVez(b){const r=vez==="retorno";
 if(r&&!pendR.length)return toast("Anexe a foto do romaneio",1);
 if(r&&rmot.trim().length<5)return toast("Descreva o motivo do retorno",1);
 if(!r&&!pend)return toast("Tire a foto do baú vazio",1);
 b.disabled=true;toast("Enviando pedidos...");try{const id=uid(),fotos=await salvarFotos(r?pendR:[pend]);await S.add(FILA,{placa:me.placa,motorista:me.nome,tipo:me.tipo,vez,retMotivo:r?rmot.trim():"",fotos,status:"analise",ts:Date.now()},id);pend=null;pendR=[];rmot="";vez="vazio";sig="";toast("Enviado para análise")}catch(e){b.disabled=false;toast("Falha ao enviar",1)}}
function rOrdem(){
 const car=FL.filter(x=>x.status==="carregando").sort((a,b)=>a.tsDoca-b.tsDoca),q=FL.filter(x=>x.status==="aprovado").sort((a,b)=>a.ts-b.ts),an=FL.filter(x=>x.status==="analise").length;
 const row=(n,x,ex)=>`<div class="card ${x.placa===me.placa?"me":""}"><div class="row"><div class="n">${n}</div>${chip(x.placa)}<div><b>${esc(x.tipo)}${x.vez==="retorno"?" · retorno":""}</b><small>chegou às ${hm(x.ts)}${ex||""}</small></div>${x.placa===me.placa?`<span class="tg b">Você</span>`:""}</div></div>`;
 $("so").innerHTML=`<div class="kp" style="grid-template-columns:repeat(3,1fr)"><div><b>${q.length}</b><span>Na fila</span></div><div><b>${car.length}</b><span>Carregando</span></div><div><b>${an}</b><span>Em análise</span></div></div>`
 +(car.length?`<h3>Nas docas</h3>`+car.map(x=>row("D"+esc(x.doca),x," · doca "+esc(x.doca))).join(""):"")
 +`<h3>Ordem de carregamento</h3>`+(q.map((x,i)=>row((i+1)+"º",x)).join("")||vz("Nenhum veículo aguardando."))}
function sair(id){if(confirm("Sair da fila?"))S.upd(FILA,id,{status:"cancelado"})}
async function pegarA(i){for(const f of i.files)pfs.push(await foto(f,me.placa));i.value="";rPf()}
function rPf(){$("pf").innerHTML=pfs.map((s,i)=>`<img src="${s}" alt="Pedido ${i+1}" title="Toque para remover" onclick="pfs.splice(${i},1);rPf()">`).join("")}
async function enviarAss(b){const cli=$("a-cli").value.trim(),d=$("a-desc").value.trim();
 if(!cli||!d)return toast("Informe cliente/pedido e a descrição",1);if(!pfs.length)return toast("Anexe ao menos um pedido",1);
 b.disabled=true;toast("Enviando pedidos...");try{const fotoIds=await salvarFotos(pfs);await S.add(ASS,{placa:me.placa,motorista:me.nome,cliente:cli,endereco:$("a-end").value.trim(),tipo:$("a-tipo").value,descricao:d,fotoIds,status:"Aberta",ts:Date.now()});
 pfs=[];rPf();["a-cli","a-end","a-desc"].forEach(i=>$(i).value="");toast("Assistência enviada")}catch(e){toast("Falha ao enviar. Tente novamente.",1)}b.disabled=false}
function rMin(){$("minhas").innerHTML=AM.filter(a=>!a.concluidaMot).sort((a,b)=>b.ts-a.ts).map(a=>`<div class="card"><div class="row"><div><b>${esc(a.tipo)}</b><small>${esc(a.cliente)} · ${fmt(a.ts)}</small></div>${tg(a.status)}</div>${a.trat?`<p class="resp"><b>${esc(a.trat)}</b>${a.obs?": "+esc(a.obs):""}</p>`:""}<button class="btn ok sm" style="margin-top:10px" onclick="concl('${a.id}','${a.status}')">Confirmar conclusão</button></div>`).join("")||`<p class="mut">Nenhuma assistência em andamento.</p>`}
function concl(id,st){if(confirm("Confirmar que a assistência foi concluída? Ela sairá da sua lista."))S.upd(ASS,id,{concluidaMot:true,tsConc:Date.now(),status:st==="Negada"?"Negada":"Concluída"})}

/* ===== ADMINISTRADOR ===== */
let AF=[],AA=[],at="an",filt="abertas",FC={},OP=new Set(),AC,UN=0,SEEN=new Set();
function entrar(){if($("pin").value!==CFG.PIN)return toast("PIN incorreto",1);
 try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
 $("lg").classList.add("hide");$("pn").classList.remove("hide");
 S.on(FILA,d=>{AF=d;rAdm()});S.on(ASS,d=>{AA=d;rAdm()},0,CFG.DIAS_ASS);purge();setInterval(rAdm,30000);setInterval(()=>{if(UN>0)beep()},2500)}
function beep(){if(!AC)return;AC.resume();const t=AC.currentTime;[880,1175].forEach((f,i)=>{const o=AC.createOscillator();o.connect(AC.destination);o.frequency.value=f;o.start(t+i*.18);o.stop(t+i*.18+.14)})}
const pendIds=()=>[...AF.filter(x=>x.status==="analise").map(x=>"f"+x.id),...AA.filter(a=>a.status==="Aberta"&&!a.concluidaMot).map(a=>"a"+a.id)];
function rAl(){const un=pendIds().filter(k=>!SEEN.has(k));UN=un.length;const nf=un.filter(k=>k[0]==="f").length,na=UN-nf,el=$("al");
 el.classList.toggle("hide",!UN);if(UN)el.innerHTML=`<span>${[nf?nf+" pedido(s) para análise":"",na?na+" assistência(s) nova(s)":""].filter(Boolean).join(" · ")}</span><button class="btn sm" onclick="ciente()">Verificar</button>`}
function ack(t){pendIds().filter(k=>k[0]==={an:"f",as:"a"}[t]).forEach(k=>SEEN.add(k))}
function ciente(){at=pendIds().some(k=>k[0]==="f"&&!SEEN.has(k))?"an":"as";ack(at);rAdm()}
const qAp=()=>AF.filter(x=>x.status==="aprovado").sort((a,b)=>a.ts-b.ts);
const aberta=a=>!["Concluída","Negada"].includes(a.status);
function rAdm(){
 rAl();const e=document.activeElement;if(e&&["INPUT","TEXTAREA","SELECT"].includes(e.tagName)&&$("pn").contains(e)&&e.id!=="hb")return;
 const nAn=AF.filter(x=>x.status==="analise").length,nFl=qAp().length,nCar=AF.filter(x=>x.status==="carregando").length,nAs=AA.filter(aberta).length;
 $("kp").innerHTML=[["Aguardando análise",nAn],["Na fila",nFl],["Carregando",nCar],["Assistências abertas",nAs]].map(k=>`<div><b>${k[1]}</b><span>${k[0]}</span></div>`).join("");
 $("tb").innerHTML=[["an","Análise de pedidos",nAn],["fl","Fila de carregamento",nFl],["as","Assistências",nAs],["hi","Histórico"]].map(t=>`<button class="${at===t[0]?"on":""}" onclick="at='${t[0]}';ack('${t[0]}');rAdm()">${t[1]}${t[2]?`<i>${t[2]}</i>`:""}</button>`).join("");
 ({an:rAn,fl:rFl,as:rAs,hi:rHi})[at]();
 loadF()}
async function gf(csv){const o=[];for(const id of csv.split(",")){if(!(id in FC))FC[id]=await S.get(id);o.push(...[].concat(FC[id]||[]))}return o}
function loadF(){document.querySelectorAll("[data-f]").forEach(async el=>{if(el.dataset.ok||el.closest("details:not([open])"))return;el.dataset.ok=1;const a=await gf(el.dataset.f);if(!a.length){el.className="mut";el.textContent="Pedidos removidos após "+CFG.FOTO_DIAS+" dias.";return}el.style.gridTemplateColumns=a.length>1?"":"1fr";el.innerHTML=a.map(s=>`<img src="${s}" alt="Pedido">`).join("");el.onclick=()=>ampliar(a)})}
function rAn(){const an=AF.filter(x=>x.status==="analise").sort((a,b)=>a.ts-b.ts);
 $("tc").innerHTML=an.map(x=>`<div class="card"><div class="row">${chip(x.placa)}<div><b>${esc(x.motorista)}</b><small>${esc(x.tipo)} · chegou às ${hm(x.ts)} (há ${dur(Date.now()-x.ts)})</small></div></div>
 ${x.vez==="retorno"?`<p class="resp"><span class="tg a">Com retorno</span> ${esc(x.retMotivo)}</p>`:""}<div class="gal fw" data-f="${(x.fotos||[x.id]).join(",")}"></div>
 <div class="acts"><button class="btn ok" onclick="apr('${x.id}')">Aprovar</button><select id="mv${x.id}" aria-label="Motivo">${MOT.map(m=>`<option>${m}</option>`).join("")}</select><button class="btn bad" onclick="rep('${x.id}')">Reprovar</button></div></div>`).join("")||vz("Nenhum pedido aguardando análise.")}
const apr=id=>S.upd(FILA,id,{status:"aprovado",tsAprov:Date.now()});
const rep=id=>S.upd(FILA,id,{status:"reprovado",motivo:$("mv"+id).value});
function rFl(){const car=AF.filter(x=>x.status==="carregando").sort((a,b)=>a.tsDoca-b.tsDoca),q=qAp(),us=car.map(x=>+x.doca);
 const lv=[...Array(CFG.DOCAS)].map((_,i)=>i+1).filter(d=>!us.includes(d));
 let h=`<div class="tools"><button class="btn" ${q.length&&lv.length?"":"disabled"} onclick="chm('${q[0]?q[0].id:""}',${lv[0]||0})">Chamar próximo</button><button class="btn ghost" onclick="copiar()">Copiar fila</button></div>`;
 if(car.length)h+=`<h3>Nas docas</h3>`+car.map(x=>`<div class="card"><div class="row"><div class="n">${esc(x.doca)}</div>${chip(x.placa)}<div><b>${esc(x.motorista)}</b><small>${esc(x.tipo)} · na doca há ${dur(Date.now()-x.tsDoca)}</small></div><button class="btn ok sm" onclick="fim('${x.id}')">Finalizar</button></div></div>`).join("");
 h+=`<h3>Fila (${q.length})</h3>`+(q.map((x,i)=>`<div class="card"><div class="row"><div class="n">${i+1}º</div>${chip(x.placa)}<div><b>${esc(x.motorista)}</b><small>${esc(x.tipo)}${x.vez==="retorno"?" · retorno":""} · espera ${dur(Date.now()-x.ts)}</small></div></div>
 <div class="acts" style="grid-template-columns:1.2fr 1fr 1fr"><select id="dc${x.id}" aria-label="Doca">${lv.map(d=>`<option value="${d}">Doca ${d}</option>`).join("")||"<option value=''>Sem doca livre</option>"}</select><button class="btn sm" onclick="chm('${x.id}',$('dc${x.id}').value)">Chamar</button><button class="btn ghost sm" onclick="rem('${x.id}')">Remover</button></div></div>`).join("")||vz("Fila vazia."));
 $("tc").innerHTML=h}
function chm(id,d){if(!id||!d)return toast("Sem doca livre",1);S.upd(FILA,id,{status:"carregando",doca:+d,tsDoca:Date.now()})}
const fim=id=>S.upd(FILA,id,{status:"finalizado",tsFim:Date.now()});
const rem=id=>{if(confirm("Remover da fila?"))S.upd(FILA,id,{status:"cancelado"})};
function copiar(){const t=qAp().map((x,i)=>`${i+1}. ${x.placa} - ${x.motorista} (${x.tipo}${x.vez==="retorno"?", retorno":""})`).join("\n");navigator.clipboard.writeText(t).then(()=>toast("Fila copiada"),()=>toast("Não foi possível copiar",1))}
function rAs(){const l=AA.filter(a=>filt==="todas"||aberta(a)),g={};l.forEach(a=>(g[a.placa]||(g[a.placa]=[])).push(a));
 let h=`<div class="tabs"><button class="${filt==="abertas"?"on":""}" onclick="filt='abertas';rAdm()">Abertas</button><button class="${filt==="todas"?"on":""}" onclick="filt='todas';rAdm()">Todas</button></div>`;
 h+=Object.keys(g).sort().map(p=>{const ab=g[p].filter(aberta).length;
  return`<details class="v" ${OP.has(p)?"open":""} ontoggle="this.open?OP.add('${p}'):OP.delete('${p}');loadF()"><summary>${chip(p)}<span class="tg ${ab?"a":"g"}">${ab?ab+" aberta(s)":"Tratadas"}</span></summary>
  ${g[p].sort((a,b)=>b.ts-a.ts).map(a=>`<div class="ass"><div class="row"><div><b>${esc(a.tipo)}</b><small>${esc(a.cliente)}${a.endereco?" · "+esc(a.endereco):""}</small><small>${fmt(a.ts)} · ${esc(a.motorista)}</small>${a.concluidaMot?`<small>Concluída pelo motorista em ${fmt(a.tsConc)}</small>`:""}</div>${tg(a.status)}</div>
  <p>${esc(a.descricao)}</p>${a.fotoIds&&a.fotoIds.length?`<div class="gal fw" data-f="${a.fotoIds.join(",")}"></div>`:`<div class="gal">${(a.fotos||[]).map(f=>`<img src="${f}" alt="Pedido da assistência" onclick="ampliar(this.src)">`).join("")}</div>`}
  <label class="l" for="tt${a.id}">Tratativa</label><select id="tt${a.id}">${TRAT.map(t=>`<option ${a.trat===t?"selected":""}>${t}</option>`).join("")}</select>
  <textarea id="ob${a.id}" rows="2" style="margin-top:8px" placeholder="Observação para o motorista">${esc(a.obs||"")}</textarea>
  <div class="acts" style="grid-template-columns:1fr 1fr"><button class="btn" onclick="trat('${a.id}','Em tratativa')">Salvar tratativa</button><button class="btn ok" onclick="trat('${a.id}','Concluída')">Concluir</button></div></div>`).join("")}</details>`}).join("")||vz("Nenhuma assistência.");
 $("tc").innerHTML=h}
function trat(id,st){const t=$("tt"+id).value;S.upd(ASS,id,{trat:t,obs:$("ob"+id).value.trim(),status:st==="Concluída"&&t==="Sem procedência"?"Negada":st,tsTrat:Date.now()});toast("Tratativa registrada")}
function rHi(){if(!$("hb")){$("tc").innerHTML=`<input id="hb" placeholder="Digite a placa (mín. 3 caracteres)" style="text-transform:uppercase;font-weight:800;letter-spacing:2px" oninput="rHi()"><div id="hl" style="margin-top:12px"></div>`}
 const q=nP($("hb").value),it=q.length<3?[]:[...AF.filter(x=>x.placa.includes(q)).map(x=>({t:x.ts,k:"Fila",p:x.placa,s:LB[x.status],d:[x.vez==="retorno"?"Retorno: "+x.retMotivo:"",x.motivo,x.doca?"Doca "+x.doca:""].filter(Boolean).join(" · "),i:(x.fotos||[x.id]).join(",")})),...AA.filter(x=>x.placa.includes(q)).map(x=>({t:x.ts,k:"Assistência",p:x.placa,s:x.status,d:x.tipo+" — "+x.cliente}))].sort((a,b)=>b.t-a.t);
 $("hl").innerHTML=it.length?`<div class="card" style="overflow-x:auto"><table><thead><tr><th>Data</th><th>Placa</th><th>Tipo</th><th>Status</th><th>Detalhe</th></tr></thead><tbody>${it.map(x=>`<tr><td>${fmt(x.t)}</td><td>${esc(x.p)}</td><td>${x.k}</td><td>${tg(x.s)}</td><td>${esc(x.d)}${x.i?`<button class="btn ghost sm" onclick="vf('${x.i}')">Pedido</button>`:""}</td></tr>`).join("")}</tbody></table></div>`:vz(q.length<3?"Busque pela placa para ver o histórico.":"Nada encontrado.")}
async function purge(){
 if(!online||localStorage.getItem("purge")===new Date().toDateString())return;
 localStorage.setItem("purge",new Date().toDateString());
 try{const lim=Date.now()-CFG.FOTO_DIAS*864e5,ini=lim-14*864e5;
 for(const c of [FILA,ASS]){
  const q=await db.collection(c).where("ts","<",lim).where("ts",">=",ini).get();let b=db.batch(),n=0;
  for(const d of q.docs){const x=d.data();if(x.fotosApagadas)continue;
   const ids=c===FILA?(x.fotos||[d.id]):(x.fotoIds||[]);
   if(n+ids.length+1>450){await b.commit();b=db.batch();n=0}
   ids.forEach(i=>b.delete(db.collection(FOT).doc(i)));
   b.update(d.ref,c===ASS&&x.fotos?{fotosApagadas:true,fotos:firebase.firestore.FieldValue.delete()}:{fotosApagadas:true});n+=ids.length+1}
  if(n)await b.commit()}}catch(e){localStorage.removeItem("purge")}}
function vf(c){gf(c).then(a=>a.length?ampliar(a):toast("Sem pedido",1))}

/* ===== INÍCIO ===== */
function modo(a){const adm=a===undefined?$("adm").classList.contains("hide"):a;
 $("drv").classList.toggle("hide",adm);$("adm").classList.toggle("hide",!adm);$("who").classList.toggle("hide",adm);
 $("mode").textContent=adm?"Voltar ao motorista":"Administrador";
 $("lk").textContent=adm?"Voltar ao motorista":"Acesso administrador";
 if(adm){const p=$("pin");if(p&&!$("lg").classList.contains("hide"))setTimeout(()=>p.focus(),50)}else initDrv()}
modo(location.hash==="#adm"||/[?&]adm\b/.test(location.search));
addEventListener("hashchange",()=>modo(location.hash==="#adm"));
</script>
